name: Build Windows Shared Library

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows (x64)
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 + dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-gstreamer
            mingw-w64-x86_64-gst-plugins-base
            mingw-w64-x86_64-gst-plugins-good

      - name: Configure
        shell: msys2 {0}
        run: cmake -S . -B build-windows-x64 -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: msys2 {0}
        run: cmake --build build-windows-x64 -j 4

      - name: Prepare package
        shell: msys2 {0}
        run: |
          mkdir -p dist/windows-x64/lib
          cp -R include dist/windows-x64/include
          find build-windows-x64 -type f \( -name "audio_link_core.dll" -o -name "audio_link_core.lib" -o -name "libaudio_link_core.dll.a" \) -exec cp {} dist/windows-x64/lib/ \;

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: audio_link_core-windows-x64
          path: dist/windows-x64
          if-no-files-found: error

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/windows-x64/**
